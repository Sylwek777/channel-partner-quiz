<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Negotiation Authority Quiz — Channel Partner Playbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Live quiz on the Channel Partner Agreement Playbook's negotiation authority &amp; escalation rules.">
<style>
  /* ---------- tokens ---------- */
  :root{
    --paper:#EEEFE9; --paper-raised:#FFFFFF; --paper-sunk:#E4E6DE;
    --ink:#1B2420; --ink-70:rgba(27,36,32,.70); --ink-45:rgba(27,36,32,.48);
    --line:rgba(27,36,32,.14); --line-strong:rgba(27,36,32,.24);
    --accent:#2A5C63; --accent-ink:#163238; --accent-soft:rgba(42,92,99,.12); --accent-soft-strong:rgba(42,92,99,.22);
    --good:#2E7D4F; --good-soft:rgba(46,125,79,.14); --good-ink:#163A26;
    --warn:#A8790E; --warn-soft:rgba(168,121,14,.14);
    --critical:#A8402C; --critical-soft:rgba(168,64,44,.14);
    --shadow:rgba(20,26,24,.12);
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#101513; --paper-raised:#171D1A; --paper-sunk:#0B0F0D;
      --ink:#E7E9E3; --ink-70:rgba(231,233,227,.72); --ink-45:rgba(231,233,227,.48);
      --line:rgba(231,233,227,.14); --line-strong:rgba(231,233,227,.26);
      --accent:#5BA0A8; --accent-ink:#BFE3E6; --accent-soft:rgba(91,160,168,.18); --accent-soft-strong:rgba(91,160,168,.30);
      --good:#4FAE78; --good-soft:rgba(79,174,120,.18); --good-ink:#B9E7CB;
      --warn:#D1A53B; --warn-soft:rgba(209,165,59,.18);
      --critical:#D8705A; --critical-soft:rgba(216,112,90,.18);
      --shadow:rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#101513; --paper-raised:#171D1A; --paper-sunk:#0B0F0D;
    --ink:#E7E9E3; --ink-70:rgba(231,233,227,.72); --ink-45:rgba(231,233,227,.48);
    --line:rgba(231,233,227,.14); --line-strong:rgba(231,233,227,.26);
    --accent:#5BA0A8; --accent-ink:#BFE3E6; --accent-soft:rgba(91,160,168,.18); --accent-soft-strong:rgba(91,160,168,.30);
    --good:#4FAE78; --good-soft:rgba(79,174,120,.18); --good-ink:#B9E7CB;
    --warn:#D1A53B; --warn-soft:rgba(209,165,59,.18);
    --critical:#D8705A; --critical-soft:rgba(216,112,90,.18);
    --shadow:rgba(0,0,0,.55);
  }
  :root[data-theme="light"]{
    --paper:#EEEFE9; --paper-raised:#FFFFFF; --paper-sunk:#E4E6DE;
    --ink:#1B2420; --ink-70:rgba(27,36,32,.70); --ink-45:rgba(27,36,32,.48);
    --line:rgba(27,36,32,.14); --line-strong:rgba(27,36,32,.24);
    --accent:#2A5C63; --accent-ink:#163238; --accent-soft:rgba(42,92,99,.12); --accent-soft-strong:rgba(42,92,99,.22);
    --good:#2E7D4F; --good-soft:rgba(46,125,79,.14); --good-ink:#163A26;
    --warn:#A8790E; --warn-soft:rgba(168,121,14,.14);
    --critical:#A8402C; --critical-soft:rgba(168,64,44,.14);
    --shadow:rgba(20,26,24,.12);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0;}
  .eyebrow{
    font-family:var(--font-mono); font-size:.68rem; letter-spacing:.11em; text-transform:uppercase;
    color:var(--ink-45);
  }
  button{font-family:inherit;}
  a{color:var(--accent-ink); text-decoration:none;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
  .tabular{font-variant-numeric:tabular-nums;}

  #app{min-height:100vh;}
  .view{min-height:100vh; display:none; flex-direction:column;}
  .view.active{display:flex;}

  /* ---------- host / qr view ---------- */
  #view-host{align-items:center; justify-content:center; padding:7vh 24px; text-align:center; position:relative;}
  .host-wrap{max-width:420px; width:100%; display:flex; flex-direction:column; align-items:center; gap:22px;}
  .host-kicker{display:flex; align-items:center; gap:8px; color:var(--accent-ink);}
  .host-kicker .dot{width:6px; height:6px; border-radius:50%; background:var(--good); box-shadow:0 0 0 3px var(--good-soft);}
  #view-host h1{font-size:clamp(1.7rem,5vw,2.3rem); line-height:1.15;}
  .host-sub{color:var(--ink-70); font-size:.96rem; max-width:360px; line-height:1.5;}
  .qr-card{
    background:#fff; border-radius:20px; padding:18px; box-shadow:0 18px 40px -12px var(--shadow), 0 0 0 1px var(--line);
  }
  .qr-card svg{display:block; width:min(62vw,250px); height:min(62vw,250px);}
  .host-count{
    font-family:var(--font-mono); font-size:.8rem; color:var(--ink-45); letter-spacing:.02em;
  }
  .host-count b{color:var(--accent-ink); font-weight:600;}
  .host-footer{
    position:fixed; bottom:18px; right:18px; display:flex; gap:10px; align-items:center;
  }
  .ghost-link{
    font-family:var(--font-mono); font-size:.72rem; letter-spacing:.04em; color:var(--ink-45);
    border:1px solid var(--line); border-radius:999px; padding:7px 13px; background:var(--paper-raised);
    cursor:pointer; transition:border-color .15s, color .15s;
  }
  .ghost-link:hover{border-color:var(--accent); color:var(--accent-ink);}

  /* ---------- shared page chrome (quiz + results) ---------- */
  .page{width:100%; max-width:600px; margin:0 auto; padding:28px 20px 120px;}
  .page-head{margin-bottom:22px;}
  .page-head h1{font-size:1.5rem; margin-top:6px;}
  .back-link{font-family:var(--font-mono); font-size:.72rem; color:var(--ink-45); display:inline-flex; gap:5px; align-items:center;}

  /* ---------- quiz view ---------- */
  .progress-rail{
    position:sticky; top:0; z-index:5; background:var(--paper); padding:14px 0 10px; margin-bottom:4px;
  }
  .progress-track{height:4px; border-radius:4px; background:var(--line); overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); width:0%; transition:width .25s ease;}
  .progress-label{font-family:var(--font-mono); font-size:.7rem; color:var(--ink-45); margin-top:7px; letter-spacing:.03em;}

  .name-field{margin:18px 0 26px;}
  .name-field label{display:block; font-size:.82rem; color:var(--ink-70); margin-bottom:7px;}
  .name-field input{
    width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--line); background:var(--paper-raised);
    color:var(--ink); font-size:.95rem; font-family:inherit;
  }
  .name-field input:focus{border-color:var(--accent);}

  fieldset.qcard{
    border:1px solid var(--line); border-radius:16px; background:var(--paper-raised); padding:18px 16px 16px;
    margin:0 0 16px; box-shadow:0 1px 0 var(--line);
  }
  fieldset.qcard legend{display:flex; gap:10px; align-items:baseline; padding:0; margin-bottom:13px; width:100%;}
  .qnum{
    font-family:var(--font-mono); font-size:.72rem; font-weight:600; color:var(--accent-ink);
    background:var(--accent-soft); border-radius:6px; padding:2px 7px; flex:none;
  }
  .qtext{font-size:.98rem; font-weight:600; line-height:1.4;}
  .opt{
    display:flex; align-items:flex-start; gap:11px; padding:11px 12px; border-radius:11px;
    border:1px solid var(--line); margin-bottom:8px; cursor:pointer; transition:border-color .12s, background .12s;
  }
  .opt:last-child{margin-bottom:0;}
  .opt:hover{border-color:var(--line-strong);}
  .opt input{position:absolute; opacity:0; pointer-events:none;}
  .opt .bullet{
    width:19px; height:19px; border-radius:50%; border:1.5px solid var(--line-strong); flex:none; margin-top:1px;
    display:flex; align-items:center; justify-content:center; transition:border-color .12s, background .12s;
  }
  .opt .bullet::after{content:""; width:9px; height:9px; border-radius:50%; background:var(--accent); transform:scale(0); transition:transform .12s;}
  .opt .olabel{font-size:.7rem; font-family:var(--font-mono); color:var(--ink-45); margin-right:2px;}
  .opt .otext{font-size:.92rem; line-height:1.4; color:var(--ink);}
  .opt:has(input:checked){border-color:var(--accent); background:var(--accent-soft);}
  .opt:has(input:checked) .bullet{border-color:var(--accent);}
  .opt:has(input:checked) .bullet::after{transform:scale(1);}
  .opt:has(input:focus-visible){outline:2px solid var(--accent); outline-offset:2px;}

  fieldset.qcard.missing{border-color:var(--critical);}
  .miss-note{color:var(--critical); font-size:.76rem; font-family:var(--font-mono); margin-top:4px; display:none;}
  fieldset.qcard.missing .miss-note{display:block;}

  .submit-bar{
    position:fixed; left:0; right:0; bottom:0; padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--paper) 55%, transparent); display:flex; justify-content:center; z-index:6;
  }
  .submit-btn{
    width:100%; max-width:560px; background:var(--accent); color:#fff; border:none; border-radius:13px;
    padding:15px 20px; font-size:.98rem; font-weight:600; cursor:pointer; box-shadow:0 10px 24px -10px var(--shadow);
    transition:opacity .15s, transform .08s;
  }
  .submit-btn:active{transform:scale(.99);}
  .submit-btn:disabled{opacity:.55; cursor:default;}
  .submit-error{color:var(--critical); font-size:.8rem; text-align:center; margin-top:10px; display:none;}

  .done-wrap{text-align:center; padding:12vh 0 0;}
  .score-ring{
    width:150px; height:150px; margin:22px auto 6px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft); position:relative;
  }
  .score-ring .num{font-family:var(--font-mono); font-size:2.1rem; font-weight:700; color:var(--accent-ink);}
  .done-note{color:var(--ink-70); font-size:.9rem; max-width:360px; margin:14px auto 0; line-height:1.5;}
  .done-note.warn-note{color:var(--warn);}
  .results-peek{margin-top:26px; font-family:var(--font-mono); font-size:.76rem;}

  /* ---------- results view ---------- */
  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:28px;}
  .stat-tile{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:14px 14px 12px;
  }
  .stat-tile .eyebrow{display:block; margin-bottom:6px;}
  .stat-tile .val{font-family:var(--font-mono); font-size:1.5rem; font-weight:700; color:var(--accent-ink);}
  .stat-tile .unit{font-size:.7rem; color:var(--ink-45); margin-left:2px;}

  .section-title{display:flex; align-items:baseline; justify-content:space-between; margin:30px 0 14px;}
  .section-title h2{font-size:1rem;}
  .legend-note{font-size:.74rem; color:var(--ink-45); display:flex; align-items:center; gap:6px;}
  .legend-swatch{width:9px; height:9px; border-radius:3px; background:var(--good); flex:none;}

  .qresult{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:16px 16px 14px; margin-bottom:12px;
  }
  .qresult .qhead{display:flex; gap:9px; align-items:baseline; margin-bottom:12px;}
  .qresult .qhead .qtext{font-size:.88rem; font-weight:600; line-height:1.4;}
  .barrow{display:grid; grid-template-columns:20px 1fr 34px; gap:9px; align-items:center; margin-bottom:7px;}
  .barrow:last-child{margin-bottom:0;}
  .barrow .olet{font-family:var(--font-mono); font-size:.72rem; color:var(--ink-45); text-align:right;}
  .barrow.correct .olet{color:var(--good-ink); font-weight:700;}
  .bartrack{height:16px; border-radius:5px; background:var(--paper-sunk); overflow:hidden; position:relative;}
  .barfill{height:100%; border-radius:5px; background:var(--ink-45); width:0%; transition:width .4s ease;}
  .barrow.correct .barfill{background:var(--good);}
  .barcount{font-family:var(--font-mono); font-size:.74rem; color:var(--ink-70); text-align:right;}

  .histwrap{background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:18px 16px;}
  .hist{display:flex; align-items:flex-end; gap:8px; height:120px;}
  .hist .histcol{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
  .hist .histbar{width:100%; max-width:30px; background:var(--accent); border-radius:5px 5px 2px 2px; min-height:2px; transition:height .4s ease;}
  .hist .histn{font-family:var(--font-mono); font-size:.68rem; color:var(--ink-45);}
  .hist .histlabel{font-family:var(--font-mono); font-size:.68rem; color:var(--ink-45); margin-top:4px;}

  .empty-state{text-align:center; color:var(--ink-45); font-size:.88rem; padding:10vh 20px;}
  .unavailable{
    margin:0 auto; max-width:420px; text-align:center; padding:12vh 24px; color:var(--ink-70); font-size:.92rem; line-height:1.6;
  }
  .live-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--good); margin-right:6px; box-shadow:0 0 0 3px var(--good-soft);}

  @media (max-width:380px){
    .stat-row{grid-template-columns:1fr 1fr 1fr; gap:8px;}
    .stat-tile .val{font-size:1.2rem;}
  }
</style>
</head>

    var bar = el("div", {"class":"submit-bar"});
    var btn = el("button", {type:"submit", "class":"submit-btn", form:"quiz-form"}, "Submit answers");
    bar.appendChild(btn);
    document.getElementById("view-quiz").appendChild(bar);

    var errNote = el("div", {"class":"submit-error", id:"submit-error"}, "Something went wrong submitting your answers. Please try again.");
    page.appendChild(errNote);

    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      handleSubmit(btn);
    });

    updateProgress();
  }

  function updateProgress(){
    var answeredCount = answers.filter(function(a){ return a !== null; }).length;
    var pct = Math.round(100 * answeredCount / QUESTIONS.length);
    var fillEl = document.getElementById("progress-fill");
    var labelEl = document.getElementById("progress-label");
    if (fillEl) fillEl.style.width = pct + "%";
    if (labelEl) labelEl.textContent = answeredCount + " of " + QUESTIONS.length + " answered";
  }

  async function handleSubmit(btn){
    var missing = [];
    answers.forEach(function(a, i){ if (a === null) missing.push(i); });
    if (missing.length){
      missing.forEach(function(i){
        var fs = document.getElementById("q-"+i);
        if (fs) fs.classList.add("missing");
      });
      var firstFs = document.getElementById("q-"+missing[0]);
      if (firstFs) firstFs.scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }

    btn.disabled = true;
    btn.textContent = "Submitting…";
    var errNote = document.getElementById("submit-error");
    if (errNote) errNote.style.display = "none";

    var score = 0;
    answers.forEach(function(a, i){ if (a === QUESTIONS[i].correct) score++; });
    lastScore = score;

    var name = (document.getElementById("resp-name") || {}).value || "";
    name = name.trim().slice(0, 40);

    var recorded = false;
    if (apiConfigured()){
      try{
        var res = await apiPost({
          name: name,
          answers: answers.slice(),
          score: score,
          total: QUESTIONS.length
        });
        recorded = !!(res && res.ok);
      } catch(e){
        recorded = false;
      }
    }

    submitted = true;
    window.__lastRecorded = recorded;
    renderQuiz();
  }

  function renderDone(){
    var wrap = el("div", {"class":"done-wrap"});
    var head = el("div", null, '<span class="eyebrow">Submitted</span>');
    wrap.appendChild(head);
    var h = el("h1", null, "Thanks for taking the quiz");
    wrap.appendChild(h);

    var ring = el("div", {"class":"score-ring"});
    ring.appendChild(el("span", {"class":"num"}, lastScore + "/" + QUESTIONS.length));
    wrap.appendChild(ring);

    var note;
    if (window.__lastRecorded){
      note = el("p", {"class":"done-note"}, "Your answers have been added to the live results.");
    } else {
      note = el("p", {"class":"done-note warn-note"}, "Your score is shown above, but it could not be added to the shared results right now — the connection to the results sheet may be down.");
    }
    wrap.appendChild(note);

    var peek = el("div", {"class":"results-peek"});
    peek.appendChild(el("a", {href:"#/results"}, "View live results →"));
    wrap.appendChild(peek);

    return wrap;
  }

  /* ---------------- HOST VIEW ---------------- */
  function mountHost(){
    document.getElementById("host-to-results").onclick = function(){ location.hash = "#/results"; };
    var countEl = document.getElementById("host-count");
    if (!apiConfigured()){
      if (countEl) countEl.textContent = "Results backend not connected yet.";
      return;
    }
    function tick(){
      apiGet({action:"count"}).then(function(data){
        var n = (data && data.total) || 0;
        if (countEl){
          countEl.innerHTML = n === 0
            ? "Waiting for the first response&hellip;"
            : "<b>"+n+"</b> response"+(n===1?"":"s")+" received so far";
        }
      }).catch(function(){
        if (countEl) countEl.textContent = "Live count unavailable right now.";
      });
    }
    tick();
    hostTimer = setInterval(tick, POLL_MS);
  }
  function unmountHost(){
    if (hostTimer){ clearInterval(hostTimer); hostTimer = null; }
  }

  /* ---------------- RESULTS VIEW ---------------- */
  function mountResults(){
    var body = document.getElementById("results-body");
    body.innerHTML = '<div class="empty-state">Loading live results&hellip;</div>';
    if (!apiConfigured()){
      body.innerHTML = '<div class="unavailable">The live results sheet is not connected yet. Ask the organizer to finish the setup step.</div>';
      return;
    }
    function tick(){
      apiGet({action:"results"}).then(function(data){
        renderResults(data);
      }).catch(function(){
        body.innerHTML = '<div class="unavailable">Could not load live results. Try reopening this page.</div>';
      });
    }
    tick();
    resultsTimer = setInterval(tick, POLL_MS);
  }
  function unmountResults(){
    if (resultsTimer){ clearInterval(resultsTimer); resultsTimer = null; }
  }

  function renderResults(data){
    var body = document.getElementById("results-body");
    body.innerHTML = "";

    var total = (data && data.total) || 0;
    if (!total){
      body.appendChild(el("div", {"class":"empty-state"}, "No responses yet. Scan the QR code on the host screen to be the first."));
      return;
    }

    var perQuestion = data.perQuestion || QUESTIONS.map(function(){ return [0,0,0,0]; });
    var scoreHist = data.scoreHist || new Array(QUESTIONS.length + 1).fill(0);
    var avg = (data.avg || 0).toFixed(1);
    var top = data.top || 0;

    var statRow = el("div", {"class":"stat-row"});
    statRow.appendChild(el("div", {"class":"stat-tile"},
      '<span class="eyebrow">Responses</span><span class="val tabular">'+total+'</span>'));
    statRow.appendChild(el("div", {"class":"stat-tile"},
      '<span class="eyebrow">Average score</span><span class="val tabular">'+avg+'</span><span class="unit">/ '+QUESTIONS.length+'</span>'));
    statRow.appendChild(el("div", {"class":"stat-tile"},
      '<span class="eyebrow">Top score</span><span class="val tabular">'+top+'</span><span class="unit">/ '+QUESTIONS.length+'</span>'));
    body.appendChild(statRow);

    var secTitle = el("div", {"class":"section-title"},
      '<h2>By question</h2><span class="legend-note"><span class="legend-swatch"></span> correct answer</span>');
    body.appendChild(secTitle);

    QUESTIONS.forEach(function(item, qi){
      var card = el("div", {"class":"qresult"});
      var qhead = el("div", {"class":"qhead"},
        '<span class="qnum">Q'+(qi+1)+'</span><span class="qtext">'+escapeHtml(item.q)+'</span>');
      card.appendChild(qhead);

      var counts = perQuestion[qi] || [0,0,0,0];
      var qTotal = counts.reduce(function(a,b){ return a+b; }, 0) || 1;
      item.options.forEach(function(optText, oi){
        var isCorrect = oi === item.correct;
        var c = counts[oi] || 0;
        var pct = Math.round(100 * c / qTotal);
        var row = el("div", {"class":"barrow" + (isCorrect ? " correct" : "")});
        row.appendChild(el("div", {"class":"olet"}, LETTERS[oi]));
        var track = el("div", {"class":"bartrack"});
        var fillBar = el("div", {"class":"barfill"});
        fillBar.style.width = pct + "%";
        track.appendChild(fillBar);
        row.appendChild(track);
        row.appendChild(el("div", {"class":"barcount tabular"}, String(c)));
        card.appendChild(row);
      });
      body.appendChild(card);
    });

    var secTitle2 = el("div", {"class":"section-title"}, '<h2>Score distribution</h2>');
    body.appendChild(secTitle2);

    var histWrap = el("div", {"class":"histwrap"});
    var hist = el("div", {"class":"hist"});
    var maxCount = Math.max.apply(null, scoreHist.concat([1]));
    scoreHist.forEach(function(c, s){
      var col = el("div", {"class":"histcol"});
      col.appendChild(el("div", {"class":"histn tabular"}, String(c)));
      var h = Math.max(2, Math.round(90 * c / maxCount));
      var bar = el("div", {"class":"histbar"});
      bar.style.height = h + "px";
      col.appendChild(bar);
      col.appendChild(el("div", {"class":"histlabel"}, String(s)));
      hist.appendChild(col);
    });
    histWrap.appendChild(hist);
    body.appendChild(histWrap);
  }

  /* ---------------- ROUTER ---------------- */
  var views = {
    host: {el:"view-host", mount:mountHost, unmount:unmountHost},
    quiz: {el:"view-quiz", mount:renderQuiz, unmount:function(){}},
    results: {el:"view-results", mount:mountResults, unmount:unmountResults}
  };
  var currentKey = null;

  function routeKey(){
    var h = location.hash.replace(/^#\/?/, "");
    if (h === "quiz") return "quiz";
    if (h === "results") return "results";
    return "host";
  }

  function navigate(){
    var key = routeKey();
    if (key === currentKey) return;
    if (currentKey && views[currentKey]) views[currentKey].unmount();
    Object.keys(views).forEach(function(k){
      document.getElementById(views[k].el).classList.toggle("active", k === key);
    });
    currentKey = key;
    views[key].mount();
  }

  window.addEventListener("hashchange", navigate);
  navigate();
})();
</script>
</body>
</html>
